<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#175b52"><title>閱讀練習室｜五上期中</title><link rel="stylesheet" href="style.css"></head><body><header><div class="eyebrow">五年級上學期 · 國語閱讀</div><h1>閱讀練習室</h1><p>讀一篇，想一想，把每一次練習留下來。</p><div id="summary"></div></header><nav aria-label="練習工具"><label>閱讀篇章 <select id="lesson"></select></label><button id="mode">查看錯題本</button><label>字體 <select id="size"><option value="22">標準 22</option><option value="26" selected>大字 26</option><option value="30">特大 30</option></select></label><button id="history">練習紀錄</button><button id="backup">備份紀錄</button><button id="restore">還原備份</button><input id="file" type="file" accept="application/json" hidden></nav><div id="saveStatus" role="status" aria-live="polite"></div><section id="historyPanel" hidden></section><main><article aria-label="閱讀文章"><div class="eyebrow">先讀文章</div><h2 id="title"></h2><div id="passage"></div><img id="illustration" alt="原題目卷的商標圖像" hidden></article><div><div id="result" role="status"></div><div id="questions"></div><div class="actions"><button class="primary" id="submit">完成這一大題・批改並記錄</button><button id="next">下一篇 →</button></div></div></main><footer><p>每次選答案或輸入文字都會自動儲存。完成一篇後，請按「批改並記錄」。</p><p>紀錄保存在這台裝置的這個瀏覽器，不會上傳 GitHub。請使用一般瀏覽並定期備份；換裝置可還原備份。造句題請家長確認。</p></footer><script src="questions.js"></script><script src="app.js"></script></body></html>
